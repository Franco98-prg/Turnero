    <main>
    <h1 class="titulo-principal">Turnero de gimnasio</h1>
     
    <section>
    
    </section>

    <div >
        <h4>Solicitar Turno</h4>
    </div>
    <article id="sacar-turno">
        <div>
            <section>
                <p>Ingrese su nombre</p>
                <input type="name" placeholder="Ingrese su nombre y apellido" id="nombreInput">
            </section>
            <section>
                <p>Ingrese su dni</p>
                <input type="number" placeholder="Ingrese su dni" id="dniInput">
            </section>
        </div>
        <div>
            <h4>Que dias deseas elegir?</h4>
            <select class="form-select" aria-label="Default select example" id="diasInput">
                <option value="" selected>Seleccione los días que prefieres</option>
                <option value="Lunes, Miércoles y Viernes">Lunes, Miércoles y Viernes</option>
                <option value="Martes y Jueves">Martes y Jueves</option>
            </select>
            <h4>Horarios disponibles</h4>
            <select class="form-select" aria-label="Default select example" id="horarioInput">
                <option value="" selected>Seleccione el horario</option>
                <option value="7:30">7:30</option>
                <option value="8:30">8:30</option>
                <option value="9:30">9:30</option>
                <option value="10:30">10:30</option>
                <option value="11:30">11:30</option>
                <option value="16:30">16:30</option>
                <option value="17:30">17:30</option>
                <option value="18:30">18:30</option>
                <option value="19:30">19:30</option>
                <option value="20:30">20:30</option>
            </select>
            <div id="contenedor"></div>
            <button id="button-enviar">ENVIAR</button>
        </div>

    </article>
    <div>
        <h4>Buscar mi turno</h4>
            <section>
                <p>Ingrese su dni</p>
                <input type="number" placeholder="Ingrese su dni" id="dniBuscarInput">
            </section>
            <div id="contenedorBuscar"></div>
            <button id="button-buscar">Buscar</button>
            <button id= "button-eliminar">Eliminar su Turno</button>
    </div>


    </main>
